name: "DevSecOps Enterprise CI/CD Pipeline"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  codeql-sast-scan:
    name: "SAST: CodeQL Analysis"
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: 'javascript'

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript"

  backend-container-pipeline:
    name: "Backend Container CI"
    needs: codeql-sast-scan
    uses: ./.github/workflows/reusable-docker-build.yml
    with:
      image_name: "interbank-backend-api"
      dockerfile_path: "src/backend/Dockerfile"
      context_path: "src/backend"
